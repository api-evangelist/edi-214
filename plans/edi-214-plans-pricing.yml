description: EDI 214 is the ANSI X12 transaction set for transportation-carrier shipment-status messages.
  The standard itself is published by ASC X12 (paid membership / spec license); commercial transport
  of EDI 214 messages is offered by VAN providers and EDI-as-a-Service vendors such as Stedi, SPS Commerce,
  Flexport, and EDI Fabric. Plans below capture the commercial archetype around EDI 214 implementation.
notes: EDI 214 is a standard, not a single SaaS API. Pricing varies by VAN/EDI-platform vendor; the entries
  below identify common commercial models. Replace with provider-specific values when scoping a particular
  vendor.
sources:
  - https://x12.org/node/4214
  - https://www.stedi.com/edi/x12/transaction-set/214
  - https://www.stedi.com/pricing
  - https://developers.flexport.com/edi/
  - https://www.spscommerce.com/edi-document/edi-214-shipment-status/
plans:
  - id: edi-214-x12-membership
    name: ASC X12 Membership / Spec License
    type: subscription
    description: ASC X12 publishes the EDI 214 specification under a license. Public viewing is limited;
      commercial implementers typically purchase X12 membership or per-spec licenses.
    entries:
      - label: X12 spec license
        name: x12_membership
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see X12.org
        userMultiplied: false
    elements:
      - name: Access to X12 4010, 5010, 8010 specs
      - name: Implementation guides
  - id: edi-214-stedi
    name: Stedi EDI Platform
    type: usage-based
    description: Stedi offers a developer-focused EDI cloud platform supporting the full X12 set including
      214. Pricing is per-document with a free tier; healthcare-focused per-document rates are published
      but transportation pricing is contract-based.
    entries:
      - label: Developer plan baseline
        name: stedi_developer
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: starting at $500
        userMultiplied: false
      - label: EDI 214 transaction
        name: stedi_214_transaction
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: EDI Inspector + JSONata Playground
      - name: Free tier for evaluation
      - name: Production REST API for X12 214
  - id: edi-214-flexport
    name: Flexport EDI 214 (Air Shipment Status)
    type: enterprise
    description: Flexport's EDI 214 air-shipment-status integration is offered to logistics partners under
      a partner agreement; pricing not publicly listed.
    entries:
      - label: Partner integration
        name: flexport_partner
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact partner team
        userMultiplied: false
    elements:
      - name: X12 4010 air-shipment-status documentation
      - name: Flexport developer portal
  - id: edi-214-sps-commerce
    name: SPS Commerce EDI Network
    type: enterprise
    description: SPS Commerce VAN-based EDI 214 fulfillment service; pricing not publicly listed.
    entries:
      - label: Network subscription
        name: sps_subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Fulfillment EDI services
      - name: Document mapping support

specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: EDI 214 (Transportation Carrier Shipment Status)
providerId: edi-214
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - EDI
  - X12
  - Logistics
description: 'FOCUS-aligned FinOps for EDI 214 implementations: cost falls on the EDI platform vendor
  (Stedi, Flexport, SPS Commerce, VAN providers) and is billed per-document, per-trading-partner, or
  via subscription. The standard itself is governed by ASC X12 membership.'
notes: EDI 214 is a standard. FinOps mapping should be reconciled per chosen vendor invoice (Stedi, SPS,
  Flexport, etc.).
sources:
  - https://x12.org/
  - https://www.stedi.com/pricing
  - https://www.spscommerce.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: ASC X12 (standard) / VAN or EDI-platform vendor (commercial)
serviceCategory: EDI
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: EDI 214 Shipment Status
  ServiceCategory: EDI
  ProviderName: ASC X12 / vendor of choice
  PublisherName: ASC X12 / vendor of choice
  InvoiceIssuerName: vendor of choice
  BillingCurrency: USD
meters:
  - name: edi_214_documents
    unit: document
    aggregation: sum
    dimensions:
      - direction
      - trading_partner
      - vendor
  - name: trading_partner_connections
    unit: partner
    aggregation: sum
    dimensions:
      - vendor
  - name: kc_kilo_characters
    unit: KC
    aggregation: sum
    dimensions:
      - vendor
principles:
  - name: Visibility
    description: Pull document counts from the chosen EDI vendor (e.g., Stedi usage report, SPS dashboard);
      reconcile against monthly invoice.
  - name: Allocation
    description: Tag 214 traffic by trading partner, mode (truckload, ocean, air), and originating supply-chain
      node.
  - name: Optimization
    description: Consolidate trading partners onto a single VAN/platform to qualify for volume tiers;
      avoid duplicate document submissions on retry; cache reference data.
  - name: Accountability
    description: Logistics IT owns the EDI vendor relationship; finance reviews per-document fees vs.
      forecast.
maintainers:
  - name: Kin Lane
    email: kin@apievangelist.com

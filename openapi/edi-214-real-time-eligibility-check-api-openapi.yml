    EligibilityCheckNonCovered:
      description: Indicates that the patient's plan doesn't cover a specific service type you submitted in the eligibility check. Note that the absence of a `nonCovered` entry doesn't mean that a specific service is covered.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount associated with this benefit.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage associated with this benefit.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
      required:
      - coverageLevel
      type: object
    EligibilityCheckRequestDependent:
      description: 'A dependent for which you want to retrieve benefits information.

        - You can only submit one dependent per eligibility check.

        - Only include the patient''s information here when they are listed as a dependent on the subscriber''s insurance plan AND the payer cannot uniquely identify them through information outside the subscriber''s policy. For example, if the dependent has their own member ID number, you should identify them in the `subscriber` object instead. This includes member IDs that differ only by a suffix, such as `01`, because the patient can still be uniquely identified.

        - Most Medicaid plans don''t support dependents, with a [few exceptions](https://www.stedi.com/docs/healthcare/send-eligibility-checks#medicaid-dependents). Sending this information to payers that don''t support dependents will either cause an error, or the payer may ignore the information and return results for the subscriber instead.

        - Each payer has different requirements, so you should supply the fields necessary for each payer to identify the dependent in their system. However, we **strongly recommend** including the dependent''s date of birth in the request when available because many payers return errors without it.

        - Enter the patient''s name exactly as written on their insurance card, if available, including any special or punctuation characters such as apostrophes, hyphens (dashes), or spaces. Visit [patient names](https://www.stedi.com/docs/healthcare/send-eligibility-checks#patient-names) for all best practices to avoid unnecessary failures.'
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckRequestDependentAdditionalInformation'
          description: Additional identification numbers for the dependent.
        address:
          $ref: '#/components/schemas/EligibilityCheckRequestAddress'
          description: The dependent's address.
        birthSequenceNumber:
          description: The number assigned to each family member born with the same birth date, such as twins or triplets. Use to indicate the birth order when there are multiple births associated with the provided birth date. Requires `relationToSubscriber`; the request is rejected when it is omitted.
          maximum: 999999999
          minimum: 1
          type: integer
        dateOfBirth:
          description: The dependent's date of birth (DOB). We **strongly recommend** including the DOB in your request. Many payers need this information to identify the patient in their system and may immediately return an error when it's not provided.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          type: string
        gender:
          $ref: '#/components/schemas/EligibilityCheckRequestPatientGender'
          description: Code indicating the dependent's gender.
        name:
          $ref: '#/components/schemas/EligibilityCheckRequestDependentName'
          description: The dependent's name.
        provider:
          $ref: '#/components/schemas/EligibilityCheckRequestEntityProvider'
          description: Information about a provider associated with the dependent who isn't the entity requesting the eligibility check, such as a referring provider. The requesting provider is specified in the request's root `provider`.
        relationToSubscriber:
          $ref: '#/components/schemas/EligibilityCheckRequestDependentRelationship'
          description: The dependent's relationship to the subscriber.
      required:
      - name
      type: object

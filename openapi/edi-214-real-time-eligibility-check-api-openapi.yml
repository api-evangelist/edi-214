  /eligibility-check:
    servers:
    - description: Production
      url: https://healthcare.us.stedi.com/2026-06-01
    post:
      description: Submit a real-time 270/271 eligibility check in JSON format
      externalDocs:
        description: Developer guide
        url: https://www.stedi.com/docs/healthcare/send-eligibility-checks
      operationId: CreateEligibilityCheck
      parameters:
      - in: header
        name: X-Forwarded-For
        schema:
          description: '**(CMS requests only):** Starting November 8, 2025, the Centers for Medicare & Medicaid Services (CMS) requires submitters to include network IP addresses from an eligibility request''s point of origin through receipt by the HETS system. To comply with this requirement, you may need to include this header in requests to CMS.


            When present, this header should contain a comma-separated list of upstream IP addresses, starting with the originating system and continuing through every intermediary. You can exclude your IP address from the list. Note that Stedi blocks eligibility requests to CMS when any IP address in the chain – the originating IP address or any in the X-Forwarded-For header – is located outside the United States.


            Visit [CMS traceability requirements](https://www.stedi.com/docs/healthcare/send-eligibility-checks#cms-traceability-requirements) for details and examples.'
          type: string
      requestBody:
        content:
          application/json:
            examples:
              CreateEligibilityCheck_example1:
                description: ''
                summary: Eligibility check
                value:
                  encounter:
                    services:
                    - system: STC
                      value: '30'
                  payerId: '61101'
                  provider:
                    name:
                      organization: Provider Name
                    npi: '1999999984'
                  subscriber:
                    dateOfBirth: '1975-05-05'
                    memberId: HUMANA123
                    name:
                      person:
                        firstName: Jane
                        lastName: Doe
              CreateEligibilityCheck_example2:
                description: The request is rejected before anything is sent to the payer. When the failure is specific to one or more members of the request, `errors` lists each one as a JSON pointer with its own message.
                summary: Invalid request
                value:
                  encounter:
                    services:
                    - system: STC
                      value: '30'
                  payerId: NOTAPAYER
                  provider:
                    name:
                      organization: Provider Name
                    npi: '1999999984'
                  subscriber:
                    dateOfBirth: '1975-05-05'
                    memberId: HUMANA123
                    name:
                      person:
                        firstName: Jane
                        lastName: Doe
              CreateEligibilityCheck_example3:
                description: 'The payer answered with an `AAA` rejection of code `79` rather than benefits, meaning it could not identify one of the participants — most often the payer ID on the route or the member''s details. A 79 is not transient, so nothing was retried. The body carries the same properties as a successful response: the `x12` is the payer''s own 271 and `errors` describes the rejection.'
                summary: Could not identify a participant
                value:
                  encounter:
                    services:
                    - system: STC
                      value: '30'
                  payerId: '61101'
                  provider:
                    name:
                      organization: Provider Name
                    npi: '1999999984'
                  subscriber:
                    dateOfBirth: '1975-05-05'
                    memberId: HUMANA123
                    name:
                      person:
                        firstName: Jane
                        lastName: Doe
              CreateEligibilityCheck_example4:
                description: 'CMS requires eligibility traffic to originate in the United States. When the originating IP address or any `X-Forwarded-For` IP address is outside the U.S., the request is not sent to the payer and the response is an `EligibilityCheckNonUsOriginException`. Its body has the same properties as a successful response: the `x12` is a synthesized 271 whose `AAA` error reports the rejection, and `errors` describes it.'
                summary: Request from outside the United States
                value:
                  encounter:
                    services:
                    - system: STC
                      value: '30'
                  payerId: CMS
                  provider:
                    name:
                      organization: Provider Name
                    npi: '1999999984'
                  subscriber:
                    dateOfBirth: '1975-05-05'
                    memberId: 1EG4TE5MK72
                    name:
                      person:
                        firstName: Jane
                        lastName: Doe
              CreateEligibilityCheck_example5:
                description: 'When your account''s real-time concurrency limit is exceeded, the request is not sent to the payer and the response is an `EligibilityCheckThrottledException`. Its body has the same properties as a successful response: the `x12` is a synthesized 271 whose `AAA` error reports the rejection, and `errors` describes it. Retry with backoff.'
                summary: Concurrency limit exceeded
                value:
                  encounter:
                    services:
                    - system: STC
                      value: '30'
                  payerId: '61101'
                  provider:
                    name:
                      organization: Provider Name
                    npi: '1999999984'
                  subscriber:
                    dateOfBirth: '1975-05-05'
                    memberId: HUMANA123
                    name:
                      person:
                        firstName: Jane
                        lastName: Doe
            schema:

          description: Used when the identification card has a number in addition to the member ID.
          type: string
        identityCardNumber:
          description: The identity card number. Present when this number differs from the member ID.
          type: string
        insurancePolicyNumber:
          description: The insurance policy number.
          type: string
        issueNumber:
          description: The issue number.
          type: string
        mbi:
          description: 'The patient''s Medicare Beneficiary Identifier (MBI). If you receive an MBI, we recommend sending a follow-up eligibility check to CMS (payer ID: CMS) for additional benefits data. Visit [Medicare Beneficiary Identifier documentation](https://www.cms.gov/training-education/partner-outreach-resources/new-medicare-card/medical-beneficiary-identifiers-mbis) for more information about the MBI format. This most commonly occurs with patients who are covered by both Medicare and Medicaid.'
          type: string
        medicaidRecipientId:
          description: The Medicaid recipient identification number.
          type: string
        medicalRecordId:
          description: The medical record identification number.
          type: string
        memberId:
          description: The member identification number - only used when checking eligibility with a Workers' Compensation or Property and Casualty insurer.
          type: string
        patientAccountNumber:
          description: The patient account number. If you included this value in the original eligibility request, the payer will return the same value here in the response.
          type: string
        plan:
          $ref: '#/components/schemas/EligibilityCheckAdditionalInformationWithName'
          description: The plan number and plan description.
        planNetwork:
          $ref: '#/components/schemas/EligibilityCheckAdditionalInformationWithName'
          description: The plan network identification number and the plan, group, or plan network name.
        priorIdentifierNumber:
          description: The prior identifier number.
          type: string
        ssn:
          description: The patient's Social Security Number (SSN).
          type: string

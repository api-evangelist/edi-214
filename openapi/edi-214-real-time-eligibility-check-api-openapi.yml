          description: Metadata about the response. Stedi uses this data for tracking and troubleshooting.
        payer:
          $ref: '#/components/schemas/EligibilityCheckPayer'
          description: Information about the payer providing the benefits information. The response will always include the payer's business name and an identifier, such as the payer's tax ID. Most payers also include contact information.
        payerId:
          description: The primary payer ID from the [Stedi Payer Network](https://www.stedi.com/healthcare/network). This ID is consistent across eligibility and claims systems and matches the payer ID printed on the member's ID card. You can use it as the `payerId` in subsequent eligibility check requests.
          type: string
        plans:
          description: The patient's insurance plans, grouped by plan name. Each plan contains the benefits that apply to the patient.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlan'
          type: array
        provider:
          $ref: '#/components/schemas/EligibilityCheckProvider'
          description: Information about the entity that submitted the original eligibility check request. This may be an individual practitioner, a medical group, a hospital, or another type of healthcare provider. This object will always include at least one identifier, such as the provider's [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier), tax ID, or EIN.
        subscriber:
          $ref: '#/components/schemas/EligibilityCheckSubscriber'
          description: Information about the primary policyholder for the insurance plan listed in the original eligibility check request. The response will always include either the subscriber's name or member ID for identification, but most payers will also return the subscriber's date of birth and other identifying information. Some payers truncate names to fit their own technical limits, so the payer may not return the subscriber's full legal name.
        warnings:
          description: Issues with your eligibility request that could affect the results, or information about the response. For example, warnings can help explain why the request was rejected.
          items:
            $ref: '#/components/schemas/EligibilityCheckWarning'
          type: array
        x12:
          description: 'Typically this property contains the raw X12 EDI [271 Eligibility Benefit Response](https://portal.stedi.com/app/guides/view/hipaa/health-care-eligibility-benefit-response-x279a1/01GS66YHZPB37ABF34DBPSR213) from the payer.


            In some circumstances, this property may contain a [999 Implementation Acknowledgment](https://portal.stedi.com/app/guides/view/hipaa/implementation-acknowledgment-x231a1/01HMRQV0N8SPHG58M4ZG1CRHH0) instead of a 271. A 999 indicates validation errors in the X12 EDI transaction, such as improper formatting or missing or invalid values.


            If this property contains a 999, many of the other response properties will be empty, as Stedi populates them with information from the 271.'
          type: string
      required:
      - id
      - payer
      - x12
      type: object
    EligibilityCheckContact:
      description: Information about a contact person for the entity.
      properties:
        ediNumbers:
          description: The contact's EDI numbers.
          items:
            type: string
          type: array
        emails:
          description: The contact's email addresses.
          items:
            type: string
          type: array
        faxNumbers:
          description: The contact's fax numbers.
          items:
            type: string
          type: array
        name:
          description: The name of the contact person.
          type: string
        phoneNumbers:
          description: The contact's phone numbers.
          items:
            type: string
          type: array
        urls:
          description: The contact's URLs.
          items:
            type: string
          type: array
      type: object
    EligibilityCheckDiagnosisCode:
      description: A single diagnosis code with its optional definition.
      properties:
        definition:
          description: The human-readable definition of the diagnosis code.
          type: string
        value:
          description: The diagnosis code value.
          type: string
      required:
      - value
      type: object
    EligibilityCheckInvalidBenefit:
      description: An invalid benefit entry that Stedi couldn't include in the standard benefit arrays due to data validation issues. This structure includes all possible benefit properties (amount, percent, quantity) to capture what the payer actually sent.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount, if present.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        invalidReasons:
          description: Reasons explaining why this entry is invalid.
          items:
            $ref: '#/components/schemas/EligibilityCheckInvalidEntryReason'
          type: array
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage, if present.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        quantity:
          $ref: '#/components/schemas/EligibilityCheckQuantity'
          description: The quantity, if present.
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
        timePeriod:
          $ref: '#/components/schemas/EligibilityCheckTimePeriod'
          description: 'Code specifying the time period for the benefit information. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#time-qualifier-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
      required:
      - coverageLevel
      - invalidReasons
      type: object
    EligibilityCheckServiceLimit:
      description: A service limit specified as an age boundary or a delivery restriction. For example, minimum age 18, or 10 visits per year on weekdays.
      oneOf:
      - properties:
          ageMaximum:
            description: The maximum patient age (in years) for this benefit.
            type: integer
        required:
        - ageMaximum
        title: ageMaximum
        type: object
      - properties:
          ageMinimum:
            description: The minimum patient age (in years) for this benefit.
            type: integer
        required:
        - ageMinimum
        title: ageMinimum
        type: object
      - properties:
          delivery:
            $ref: '#/components/schemas/EligibilityCheckServiceDeliveryLimit'
            description: A restriction on how much of the service the patient can receive, and how often or when it can be delivered.
        required:
        - delivery
        title: delivery
        type: object
    InjuryCodeCategory:
      description: Payers may sometimes return other non-compliant values.
      enum:
      - '44'
      type: string
    EligibilityCheckDateRange:
      description: A calendar date range. Both bounds are optional and at least one is always present; `end` is inclusive. A point-in-time date is carried in `start`.
      properties:
        end:
          description: The inclusive end of the range.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          type: string
        start:
          description: The start of the range, or a single point-in-time date.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          type: string
      type: object
    EligibilityCheckOutOfPocket:
      description: An out-of-pocket maximum benefit entry. The `amount` is the limit on what the patient pays. The decimal precision reflects what the payer sent (e.g., `5000.0` or `5000`). Check `timePeriod` to determine whether an amount is the full maximum or the amount remaining.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'

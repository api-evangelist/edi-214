    HealthCareInformation:
      properties:
        diagnosisCode:
          description: The diagnosis code. Omit the decimal points in diagnosis codes - the decimal point is assumed.
          maxLength: 30
          minLength: 1
          pattern: ^[A-Za-z0-9]+$
          type: string
        diagnosisTypeCode:
          $ref: '#/components/schemas/DiagnosisTypeCode'
      required:
      - diagnosisCode
      - diagnosisTypeCode
      type: object
    SubscriberTraceNumber:
      properties:
        originatingCompanyIdentifier:
          description: The identifier of the organization that assigned the trace number.
          type: string
        referenceIdentification:
          description: The unique trace number assigned to the transaction.
          type: string
        secondaryReferenceIdentification:
          description: Identifies a subdivision within the organization that assigned the trace number.
          type: string
        traceType:
          description: The full name of the `traceTypeCode`. For example `Current Transaction Trace Numbers`.
          type: string
        traceTypeCode:
          description: The code that identifies the type of trace number. Can be `1` - Current Transaction Trace Numbers (refers to trace numbers assigned by the payer) or `2` - Referenced Trace Numbers (refers to numbers sent in the original eligibility check request).
          type: string
      type: object
    EligibilityCheckRequestEntityProviderCode:
      description: A code indicating the type of provider. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list.
      enum:
      - ADMITTING
      - ATTENDING
      - BILLING
      - CONSULTING
      - COVERING
      - HOSPITAL
      - HOME_HEALTH_CARE
      - LABORATORY
      - OTHER_PHYSICIAN
      - PHARMACIST
      - PHARMACY
      - PRIMARY_CARE_PHYSICIAN
      - PERFORMING
      - RURAL_HEALTH_CLINIC
      - REFERRING
      - SUBMITTING
      - SKILLED_NURSING_FACILITY
      - SUPERVISING
      type: string
    ResponseProvider:
      description: Information about the entity that submitted the original eligibility check request. This may be an individual practitioner, a medical group, a hospital, or another type of healthcare provider. This object will always include at least one identifier, such as the provider's [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier), tax ID, or EIN.
      properties:
        aaaErrors:
          items:
            $ref: '#/components/schemas/EligibilityCheckProviderError'
          type: array
        address:
          $ref: '#/components/schemas/Address'
          description: The provider's contact information.
        employersId:
          deprecated: true
          description: 'Deprecated; The provider''s identification number for the entity receiving the benefits information.

            This shape is deprecated: This property is no longer used.'
          type: string
        entityIdentifier:
          $ref: '#/components/schemas/ResponseProviderEntityIdentifier'
        entityType:
          $ref: '#/components/schemas/EntityTypeQualifier'
        federalTaxpayersIdNumber:
          description: The Federal Taxpayer Identification Number (also known as an EIN).
          pattern: ^\d{9}$
          type: string
        middleName:
          description: The provider's middle name. This applies to providers that are an individual.
          type: string
        npi:
          description: The provider's [National Provider Identifier (NPI)](https://www.stedi.com/docs/healthcare/national-provider-identifier).
          pattern: ^\d{10}$
          type: string
        payorIdentification:
          description: The payer identification.
          type: string
        pharmacyProcessorNumber:
          description: The pharmacy processor number.
          type: string
        providerCode:
          $ref: '#/components/schemas/ResponseProviderCode'
          description: 'A code that communicates the provider''s role in the type of benefits information in the response. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        providerFirstName:
          description: The provider's first name. This applies to providers that are an individual.
          type: string
        providerName:
          description: The provider's last name. This applies to providers that are an individual.
          type: string
        providerOrgName:
          description: The provider's organization name.
          type: string
        referenceIdentification:
          description: The Health Care Provider Taxonomy Code.
          type: string
        serviceProviderNumber:
          description: The service provider number. This is an identification number assigned by the payer.
          type: string
        servicesPlanID:
          description: The Centers for Medicare and Medicaid Services (CMS) Plan ID.
          type: string
        ssn:
          description: The Social Security Number (SSN).
          pattern: ^\d{9}$
          type: string
        suffix:
          description: The provider's name suffix, such as Jr., Sr., or III.
          type: string
      type: object
    CreateEligibilityCheckRequestContent:
      description: The eligibility check request payload.
      properties:
        dependent:
          $ref: '#/components/schemas/EligibilityCheckRequestDependent'
          description: 'A dependent for which you want to retrieve benefits information.

            - You can only submit one dependent per eligibility check.

            - Only include the patient''s information here when they are listed as a dependent on the subscriber''s insurance plan AND the payer cannot uniquely identify them through information outside the subscriber''s policy. For example, if the dependent has their own member ID number, you should identify them in the `subscriber` object instead. This includes member IDs that differ only by a suffix, such as `01`, because the patient can still be uniquely identified.

            - Most Medicaid plans don''t support dependents, with a [few exceptions](https://www.stedi.com/docs/healthcare/send-eligibility-checks#medicaid-dependents). Sending this information to payers that don''t support dependents will either cause an error, or the payer may ignore the information and return results for the subscriber instead.

            - Each payer has different requirements, so you should supply the fields necessary for each payer to identify the dependent in their system. However, we **strongly recommend** including the dependent''s date of birth in the request when available because many payers return errors without it.

            - Enter the patient''s name exactly as written on their insurance card, if available, including any special or punctuation characters such as apostrophes, hyphens (dashes), or spaces. Visit [patient names](https://www.stedi.com/docs/healthcare/send-eligibility-checks#patient-names) for all best practices to avoid unnecessary failures.'
        eligibilitySearchId:
          description: An identifier that allows Stedi to group eligibility checks for the same patient into a unified record in the Stedi portal called an [eligibility search](https://www.stedi.com/docs/healthcare/eligibility-views).
          type: string
        encounter:
          $ref: '#/components/schemas/EligibilityCheckRequestEncounter'
          description: 'Details about the eligibility or benefit information you are requesting for the patient.

            - You can optionally include service type codes (STCs) or procedure codes to request benefits for specific services.

            - You can specify either a single service date or a date range using `dates.service`. The payer defaults to using the current date in their timezone if you don''t include one.

            - When checking eligibility for today, omit the service date to ensure consistent behavior across payers.

            - We recommend submitting dates up to 12 months in the past or up to the end of the current month. Payers aren''t required to support dates outside these ranges. However, some payers such as the Centers for Medicare and Medicaid Services (CMS) do support requests for dates further in the future - especially the next calendar month. Check the payer''s documentation to determine their specific behavior.'
        externalPatientId:
          description: A unique identifier for the patient that Stedi uses to identify and correlate historical eligibility checks for the same individual. We recommend including this value in all requests.
          maxLength: 36
          type: string
        payerId:
          description: "The payer ID. Visit the [Payer Network](https://www.stedi.com/healthcare/network) for a complete list.\n - You can send requests using the primary payer ID, the Stedi payer ID, or any alias listed in the payer record.\n - You must include leading `0` characters - payer IDs are alphanumeric strings and must be treated as complete strings, not integers. For example, use `00540` for SISCO, not `540`."
          maxLength: 80
          minLength: 1
          type: string
        payerName:
          description: The payer's name, such as Cigna or Aetna.
          maxLength: 60
          minLength: 1
          type: string
        provider:
          $ref: '#/components/schemas/EligibilityCheckRequestProvider'
          description: "Information about the entity requesting the eligibility check. This may be an individual practitioner, a medical group, a hospital, or another type of healthcare provider.\n - You must provide the provider's name as either a person (with `name.person`) or an organization (with `name.organization`).\n - You must also provide an identifier - this is typically the provider's [National Provider Identifier](https://www.stedi.com/docs/healthcare/national-provider-identifier) (`npi`). If the provider doesn't have an NPI, you can supply an alternative, such as their `tin` or `ssn`.\n - Don't include additional properties, such as `tin` or `address`, unless they are specifically required or suggested by the payer."
        subscriber:
          $ref: '#/components/schemas/EligibilityCheckRequestSubscriber'
          description: 'The primary policyholder for the insurance plan _or_ a dependent with a unique member ID. If a dependent has a unique member ID, include their information here and leave `dependent` empty.

            - At a minimum, our API requires that you supply at least one of these fields in the request: `memberId`, `dateOfBirth`, or `name.person.lastName`. However, each payer has different requirements, so you should supply the fields necessary for each payer to identify the subscriber in their system.

            - When you provide all four of `memberId`, `dateOfBirth`, `name.person.firstName`, and `name.person.lastName`, payers must return a response if the member is in their database. Some payers may be able to search with less information, but this varies by payer.

            - We recommend always including the patient''s member ID when possible.

            - Enter the patient''s name exactly as written on their insurance card, if available, including any special or punctuation characters such as apostrophes, hyphens (dashes), or spaces. Visit [patient names](https://www.stedi.com/docs/healthcare/send-eligibility-checks#patient-names) for all best practices to avoid unnecessary failures.'
      required:
      - payerId
      - provider
      - subscriber
      type: object
    EligibilityCheckPlaceOfServiceCode:
      description: 'Standardized code identifying the type of healthcare facility where providers may deliver services.


        Payers may sometimes return other non-compliant values.'
      enum:

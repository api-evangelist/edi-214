          $ref: '#/components/schemas/EligibilityCheckSubscriber'
          description: Information about the primary policyholder for the insurance plan listed in the original eligibility check request. The response will always include either the subscriber's name or member ID for identification, but most payers will also return the subscriber's date of birth and other identifying information. Some payers truncate names to fit their own technical limits, so the payer may not return the subscriber's full legal name.
        warnings:
          description: Issues with your eligibility request that could affect the results, or information about the response. For example, warnings can help explain why the request was rejected.

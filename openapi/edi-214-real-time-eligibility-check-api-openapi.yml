            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
        status:
          $ref: '#/components/schemas/EligibilityCheckCoverageStatus'
          description: The patient's coverage status, indicating whether their coverage is active or inactive for specific services.
      required:
      - coverageLevel
      - status
      type: object

          $ref: '#/components/schemas/Address'
          description: The address of the entity, such as a provider or organization.
        contactInformation:
          $ref: '#/components/schemas/ContactInformation'
          description: The contact information for the entity, such as a phone number or email address.
        entityFirstname:
          description: The first name of the entity, if the entity is a person.
          type: string
        entityIdentification:
          $ref: '#/components/schemas/BenefitRelatedEntityIdentification'
          description: 'Code identifying the type of identifier in the `entityIdentificationValue` property. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#identification-code-qualifiers) for a complete list.


            Payers may sometimes return other non-compliant values.'
        entityIdentificationValue:
          description: The identification number for the entity, qualified by the code in `entityIdentification`.
          type: string
        entityIdentifier:
          $ref: '#/components/schemas/RelatedEntityIdentifierName'
          description: 'Code identifying an organizational entity, a physical location, property, or individual. When set to `Party Performing Verification` for a BCBS payer, this is the patient''s home plan.


            Payers may sometimes return other non-compliant values.'
        entityMiddlename:
          description: The middle name or initial of the entity, if the entity is a person.
          type: string
        entityName:
          description: The last name (if the entity is a person) or the business name (if the entity is an organization).
          type: string
        entityRelationship:
          $ref: '#/components/schemas/BenefitsRelatedEntityRelationshipCode'
          description: 'Code specifying the relationship between the entity and the patient. Can be `01` - Parent, `02` - Child, `27` - Domestic Partner, `41` - Spouse, `48` - Employee, `65` - Other, or `72` - Unknown.


            Payers may sometimes return other non-compliant values.'
        entitySuffix:
          description: The name suffix, such as Sr. Jr. or III.
          type: string
        entityType:
          $ref: '#/components/schemas/EntityTypeQualifier'
        providerInformation:
          $ref: '#/components/schemas/ProviderInformation'
      type: object
    EligibilityCheckServiceDeliveryLimitPeriod:
      description: The time period for a service delivery limit, like per year, per day, or lifetime.
      properties:
        qualifier:
          $ref: '#/components/schemas/EligibilityCheckServiceDeliveryLimitPeriodQualifier'
          description: 'The type of time period `value` counts.



components:
  schemas:
    AuthenticationFailedExceptionResponseContent:
      description: The request credentials are missing or not valid.
      properties:
        message:
          description: Why the request failed. The wording can change, so branch on the exception type, not this text.
          type: string
      required:
      - message
      type: object
    ProviderType:
      description: Identify the type of provider.
      enum:
      - payer
      - third-party administrator
      - employer
      - hospital
      - facility
      - gateway provider
      - plan sponsor
      - provider
      type: string
    IndividualRelationshipCode:
      description: The dependent's relationship to the subscriber. You can set this to `01` - Spouse, `19` - Child, `34` - Other Adult.
      enum:
      - '01'
      - '19'
      - '34'
      type: string
    EligibilityCheckRequestProvider:
      description: "Information about the entity requesting the eligibility check. This may be an individual practitioner, a medical group, a hospital, or another type of healthcare provider.\n - You must provide the provider's name as either a person (with `name.person`) or an organization (with `name.organization`).\n - You must also provide an identifier - this is typically the provider's [National Provider Identifier](https://www.stedi.com/docs/healthcare/national-provider-identifier) (`npi`). If the provider doesn't have an NPI, you can supply an alternative, such as their `tin` or `ssn`.\n - Don't include additional properties, such as `tin` or `address`, unless they are specifically required or suggested by the payer."
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckRequestProviderAdditionalInformation'
          description: Additional identification numbers for the provider. Only include when specifically required by a payer.
        address:
          $ref: '#/components/schemas/EligibilityCheckRequestAddress'
          description: The provider's address. Only include when specifically instructed by a payer, such as when the provider has multiple locations and you need to identify the specific location making the request.
        ein:
          description: The Employer Identification Number (EIN), distinct from the Federal Taxpayer Identification Number in `tin`. Only include when the payer requires it.
          pattern: ^\d{9}$
          type: string
        name:
          $ref: '#/components/schemas/EligibilityCheckRequestProviderName'
          description: The provider's name, as either a person or an organization.
        npi:
          description: 'The provider''s [National Provider Identifier (NPI)](https://www.stedi.com/docs/healthcare/national-provider-identifier).


            All healthcare providers eligible for an NPI must provide this identifier. Some non-traditional providers such as transportation services, durable medical equipment (DME) suppliers, or alternative medicine practitioners can''t receive an NPI. If the provider doesn''t have an NPI, payers virtually never support requests with alternate IDs. In the rare circumstance that a payer has instructed you to use an alternate ID, the payer will typically require you to supply either their `tin` or `ssn` instead.'
          pattern: ^\d{10}$
          type: string
        pharmacyProcessorNumber:
          description: The provider's pharmacy processor number. Only include when specifically instructed by a payer - for example, when the provider doesn't have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.
          maxLength: 80
          minLength: 2
          type: string
        provider:
          $ref: '#/components/schemas/EligibilityCheckRequestEntityProvider'
          description: Information about the provider's role and taxonomy. Only include when required by a payer.
        serviceProviderNumber:
          description: The provider's service provider number. Only include when specifically instructed by a payer - for example, when the provider doesn't have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.
          maxLength: 80
          minLength: 2
          type: string
        ssn:
          description: 'The provider''s Social Security Number (SSN).

            - Only include when specifically instructed by a payer - for example, if the provider doesn''t have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.

            - If the payer has instructed you to send an EIN but the provider operates using their SSN, use `provider.tin` instead of this field.

            - Don''t use this for Federally-administered programs, such as Medicare.'
          pattern: ^\d{9}$
          type: string
        tin:
          description: The provider's Federal Taxpayer Identification Number. This is typically the provider's EIN (Employer Identification Number), but you may use the provider's SSN if the provider doesn't have an EIN. Only include if the payer requires it.
          pattern: ^\d{9}$
          type: string
        type:
          $ref: '#/components/schemas/EligibilityCheckRequestProviderType'
          description: The type of provider making the request.
      required:
      - name
      type: object
    EligibilityCheckQuantity:
      description: A quantity value with a qualifier describing the unit of measure. For example, a value of `10` with a qualifier of `VISITS` means 10 visits.
      properties:
        qualifier:
          $ref: '#/components/schemas/EligibilityCheckQuantityQualifier'
          description: 'The unit of measure for `value`.


            Payers may sometimes return other non-compliant values.'
        value:
          description: The numeric quantity. For example, `10` when the `qualifier` is `VISITS`.
          type: string
      type: object
    EligibilityCheckManagedCareCoordinator:
      description: A care coordinator associated with the patient's managed care arrangement. When present, the care coordinator's details are in the `relatedEntities` array.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount associated with this benefit.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage associated with this benefit.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
      required:
      - coverageLevel
      type: object
    ResponseSubscriber:
      description: Information about the primary policyholder for the insurance plan listed in the original eligibility check request. The response will always include either the subscriber's name or member ID for identification, but most payers will also return the subscriber's date of birth and other identifying information. Some payers truncate names to fit their own technical limits, so the payer may not return the subscriber's full legal name.
      properties:
        aaaErrors:
          items:
            $ref: '#/components/schemas/EligibilityCheckSubscriberError'
          type: array
        address:
          $ref: '#/components/schemas/Address'
        birthSequenceNumber:
          description: The number assigned to each family member born with the same birth date, such as twins or triplets. Indicates the birth order when there are multiple births associated with the provided birth date.
          type: string
        dateOfBirth:
          description: The member's date of birth.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        dateTimePeriod:
          description: The military service date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        dateTimePeriodFormatQualifier:
          $ref: '#/components/schemas/DateTimePeriodFormatQualifier'
          description: 'The format of the military service date and time period. Can be `D8` - Date or `RD8` - Range of Dates.


            Payers may sometimes return other non-compliant values.'
        description:
          description: Context that identifies the exact military unit. Used to report military service data.
          type: string
        employmentStatusCode:
          $ref: '#/components/schemas/EmploymentStatusCode'
          description: 'The member''s employment status code, used to report military service data. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#employment-status-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        endDateTimePeriod:
          description: The military service end date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        entityIdentifier:
          $ref: '#/components/schemas/ResponseSubscriberEntityIdentifier'
        entityType:
          $ref: '#/components/schemas/EntityTypeQualifier'
          description: 'The entity type for the member. It can technically be set to `Person` or `Non-Person Entity`. In practice, our customers only receive `Person`.


            Payers may sometimes return other non-compliant values.'
        firstName:
          description: The member's first name.
          type: string
        gender:
          $ref: '#/components/schemas/GenderWithUnknown'
          description: Code indicating the patient's gender.
        governmentServiceAffiliationCode:
          $ref: '#/components/schemas/GovernmentServiceAffiliationCode'
          description: 'The member''s government service affiliation code, used to report military service data. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#government-service-affiliation-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        groupDescription:
          description: Group name
          type: string
        groupNumber:
          description: The group number associated with the insurance policy.
          type: string
        healthCareDiagnosisCodes:
          items:
            $ref: '#/components/schemas/HealthCareDiagnosisCode'
          type: array
        informationStatusCode:
          $ref: '#/components/schemas/InformationStatusCode'
          description: 'The status of the member''s information, used to report military service data. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#information-status-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        insuredIndicator:
          $ref: '#/components/schemas/SubscriberInsuredIndicator'
        lastName:
          description: The member's last name.
          type: string
        maintenanceReasonCode:
          $ref: '#/components/schemas/MaintenanceReasonCode'
        maintenanceTypeCode:
          $ref: '#/components/schemas/MaintenanceTypeCode'
        memberId:
          description: The member ID for the insurance policy.
          type: string
        middleName:
          description: The member's middle name or initial.
          type: string
        militaryServiceRankCode:
          $ref: '#/components/schemas/MilitaryServiceRankCode'
          description: 'The member''s military service rank code. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#military-service-rank-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        planDescription:
          description: Plan name
          type: string
        planNetworkDescription:
          description: Plan network name
          type: string
        planNetworkIdNumber:
          description: The network identification number associated with the insurance policy.
          type: string
        planNumber:
          description: The plan number associated with the insurance policy.
          type: string
        relationToSubscriber:
          $ref: '#/components/schemas/SubscriberRelationship'
        relationToSubscriberCode:
          $ref: '#/components/schemas/SubscriberRelationshipCode'
        responseProvider:
          $ref: '#/components/schemas/ResponseProvider'
        ssn:
          description: The member's Social Security Number (SSN).
          pattern: ^\d{9}$
          type: string
        startDateTimePeriod:
          description: The military service start date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        suffix:
          description: The name suffix, such as Jr., Sr., or III.
          type: string
        uniqueHealthIdentifier:
          description: The member's unique health identifier.
          type: string
      type: object
    EligibilityCheckRequestEntityProvider:
      description: Information about a provider's role and taxonomy.
      properties:
        code:
          $ref: '#/components/schemas/EligibilityCheckRequestEntityProviderCode'
          description: A code indicating the type of provider. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list.
        reference:
          description: The provider's taxonomy code.
          maxLength: 50
          minLength: 1
          type: string
      type: object
    QuantityQualifierName:
      description: 'The name of the quantity qualifier code.


        Payers may sometimes return other non-compliant values.'
      enum:
      - Minimum
      - Quantity Used
      - Covered - Actual
      - Covered - Estimated
      - Number of Co-insurance Days
      - Deductible Blood Units
      - Days
      - Hours
      - Life-time Reserve - Actual
      - Life-time Reserve - Estimated
      - Maximum
      - Month
      - Number of Services or Procedures
      - Quantity Approved
      - Age, High Value
      - Age, Low Value
      - Visits
      - Years
      type: string
    UnitForMeasurementCode:
      description: 'Code specifying the unit of measurement for the quantity.


        Payers may sometimes return other non-compliant values.'
      enum:
      - DA
      - MO
      - VS
      - WK
      - YR
      type: string
    EligibilityCheckEntityProviderCode:
      description: 'A code indicating the type of provider. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list.


        Payers may sometimes return other non-compliant values.'
      enum:
      - ADMITTING
      - ATTENDING

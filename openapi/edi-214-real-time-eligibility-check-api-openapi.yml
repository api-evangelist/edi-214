    RequestDependent:
      properties:
        additionalIdentification:
          $ref: '#/components/schemas/AdditionalIdentificationDependent'
        address:
          $ref: '#/components/schemas/RequestDependentAddress'
        beginningCardIssueDate:
          description: The date the insurance card was issued. Use when you need to specify a date range. Provide the end of the range in the `endCardIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        beginningPlanIssueDate:
          description: The date the insurance plan begins. Use when you need to specify a date range. Provide the end of the range in the `endPlanIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        birthSequenceNumber:
          description: The number assigned to each family member born with the same birth date, such as twins or triplets. Use to indicate the birth order when there are multiple births associated with the provided birth date.
          maxLength: 9
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        dateOfBirth:
          description: The dependent's date of birth (DOB). We **strongly recommend** including the DOB in your request. Many payers need this information to identify the patient in their system and immediately return an error when it's not provided.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        eligibilityCategory:
          description: The eligibility category for the dependent.
          maxLength: 50
          minLength: 1
          type: string
        endCardIssueDate:
          description: The date the insurance card expires. Use when you need to specify a date range. Provide the start of the range in the `beginningCardIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        endPlanIssueDate:
          description: The date the insurance plan ends. Use when you need to specify a date range. Provide the start of the range in the `beginningPlanIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        firstName:
          description: The dependent's first name.
          maxLength: 35
          minLength: 1
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
          description: Code indicating the dependent's gender.
        groupNumber:
          description: The group number for the dependent's insurance plan.
          maxLength: 50
          minLength: 1
          type: string
        healthCareCodeInformation:
          description: "Information about the dependent's health care diagnosis. You can include up to eight entries in this array. \n\nThe first array entry must have `diagnosisTypeCode` set to `ABK`. All subsequent entries must have `diagnosisTypeCode` set to `ABF`."
          items:
            $ref: '#/components/schemas/HealthCareInformation'
          maxItems: 8
          minItems: 1
          type: array
        idCard:
          description: The dependent's insurance card number.
          maxLength: 50
          minLength: 1
          type: string
        idCardIssueDate:
          description: The date the insurance card was issued. Use to specify a single date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        individualRelationshipCode:
          $ref: '#/components/schemas/IndividualRelationshipCode'
        issueNumber:
          description: The issue number for the dependent's insurance policy.
          maxLength: 50
          minLength: 1
          type: string
        lastName:
          description: The dependent's last name. **Don't** include the dependent's name suffix, such as Jr. or III. Use the designated `suffix` property instead.
          maxLength: 60
          minLength: 1
          type: string
        memberId:
          deprecated: true
          description: 'This shape is deprecated: This property is no longer used.'
          maxLength: 80
          minLength: 2
          pattern: ^[A-Za-z0-9- ]+$
          type: string
        middleName:
          description: The dependent's middle name or middle initial.
          maxLength: 25
          minLength: 1
          type: string
        planIssueDate:
          description: The date the insurance plan begins. Use to specify a single date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        providerCode:
          $ref: '#/components/schemas/RequestDependentProviderCode'
        providerIdentifier:
          description: The provider identifier you specified in the `referenceIdentificationQualifier` property. For example, the provider's National Provider ID or Federal Taxpayer Identification number. If you set the `referenceIdentificationQualifier` to `PXC`, then this property should contain the provider's taxonomy code.
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9]+$
          type: string
        referenceIdentificationQualifier:
          $ref: '#/components/schemas/RequestDependentReferenceIdentificationQualifier'
        ssn:
          description: The dependent's social security number. Don't use this for Federally-administered programs, such as Medicare.
          pattern: ^\d{9}$
          type: string
          x-meta:
            title: Social Security Number (SSN)
        suffix:
          description: The dependent's name suffix, such as Sr. or III. Only include the dependent's personal name suffix - **don't** include professional or academic titles, such as M.D. or MBA.
          maxLength: 10
          minLength: 1
          type: string
      type: object
    MedicalProcedureProductOrServiceIDQualifier:
      description: Code identifying the type/source of the `procedureCode`. You can set this to `AD` - American Dental Association Codes, `CJ` - Current Procedural Terminology (CPT) Codes, `HC` - Health Care Financing Administration Common Procedural Coding System (HCPCS) Codes, `ID` - International Classification of Diseases, 9th Revision, Clinical Modification (ICD-9-CM) - Procedure, `IV` - Home Infusion EDI Coalition (HIEC) Product/Service Code, `N4` - National Drug Code in 5-4-2 Format, or `ZZ` - Mutually Defined.
      enum:
      - AD
      - CJ
      - HC
      - ID
      - IV
      - N4
      - ZZ
      type: string
    EligibilityCheckProviderError:
      description: When a payer rejects your eligibility check, the response contains one or more `AAA` errors that specify the reasons for the rejection and any recommended follow-up actions. Common reasons for rejection at the `provider` level include missing or incorrect information and issues with the provider's NPI registration with the payer. [Learn more](https://www.stedi.com/docs/healthcare/eligibility-troubleshooting#payer-aaa-errors)
      properties:
        code:
          $ref: '#/components/schemas/EligibilityCheckProviderErrorCode'
          description: 'The error code.


            Payers may sometimes return other non-compliant values.'
        description:
          description: The error description.
          type: string
        field:
          description: The error type, `AAA`.
          type: string
        followupAction:
          $ref: '#/components/schemas/EligibilityCheckProviderAndMemberFollowupAction'
          description: 'Recommended follow-up action based on the rejection reason code.


            **Note**: `Resubmission Not Allowed` doesn''t mean you should never resubmit the request. Intermediary clearinghouses may send this code when they''ve temporarily lost connection to the payer, so this code indicates that you should wait at least a few minutes before retrying instead of retrying immediately.


            Payers may sometimes return other non-compliant values.'
        location:
          description: The location of the error within the original X12 EDI response.
          type: string
        possibleResolutions:
          description: 'Information to help you correct the error.


            We periodically update this guidance, so these strings may change at any time and may differ between eligibility responses. **Don''t build programmatic logic that depends on matching these strings exactly.**'
          type: string
      type: object
    ValidationException:
      description: 'A standard error for input validation failures.

        This should be thrown by services when a member of the input structure

        falls outside of the modeled or documented constraints.'
      properties:
        fieldList:
          description: 'A list of specific failures encountered while validating the input.

            A member can appear in this list more than once if it failed to satisfy multiple constraints.'
          items:
            $ref: '#/components/schemas/ValidationExceptionField'
          type: array
        message:
          description: A summary of the validation failure.
          type: string
      required:
      - message
      title: ValidationException
      type: object
    EligibilityRawX12Check400ErrorResponseContent:
      oneOf:
      - $ref: '#/components/schemas/RawEligibilityResponseValidationErrors'
      - $ref: '#/components/schemas/ValidationException'
    EligibilityCheckMeta:
      description: Metadata about the response. Stedi uses this data for tracking and troubleshooting.
      properties:
        outboundTraceId:
          description: 'The transaction identifier Stedi assigns to the outbound request''s `BHT03` element.


            Although this is a unique identifier, we recommend using `id` instead to identify and track eligibility checks. An eligibility check''s `id` is guaranteed to be globally unique, and you can use it to deep link to the eligibility check''s results within the Stedi portal.'
          type: string
        subscriberTraceNumbers:
          description: A unique identifier the payer may assign to the transaction. Stedi doesn't support setting a subscriber trace number in the eligibility check request because there is no need to include a trace number for real-time queries.
          items:
            $ref: '#/components/schemas/EligibilityCheckSubscriberTraceNumber'
          type: array
        traceId:
          description: The transaction identifier from the response's `BHT03` element. Matches the request's `BHT03` if provided, otherwise matches the Stedi-generated `outboundTraceId`.
          type: string
      type: object

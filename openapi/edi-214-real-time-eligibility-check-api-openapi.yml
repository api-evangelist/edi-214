          type: string
        pharmacyProcessorNumber:
          description: The provider's pharmacy processor number. Only include when specifically instructed by a payer - for example, when the provider doesn't have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.
          maxLength: 80
          minLength: 2
          type: string
        priorIdentifierNumber:
          description: The provider's prior identifier number. Only include when required by a payer.
          maxLength: 50
          minLength: 1
          type: string
        providerCode:
          $ref: '#/components/schemas/RequestProviderCode'
          description: Communicate the provider's role in the type of benefits specified in the request. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list. Only include when required by a payer.
        providerPlanNetworkIdNumber:
          description: The provider's plan network identification number. Only include when required by a payer.
          maxLength: 50
          minLength: 1
          type: string
        providerType:
          $ref: '#/components/schemas/ProviderType'
        referenceIdentification:
          description: The provider's [Taxonomy Code](https://x12.org/codes/provider-taxonomy-codes). Only used when the provider's taxonomy code is relevant to the eligibility/benefit inquiry. For example, an institutional provider such as a hospital may need to use a taxonomy code to specify a specific unit or department.
          type: string
        serviceProviderNumber:
          description: The provider's service provider number. Only include when specifically instructed by a payer - for example, when the provider doesn't have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.
          maxLength: 80
          minLength: 2
          type: string
        servicesPlanID:
          deprecated: true
          maxLength: 80
          minLength: 2
          type: string
        ssn:
          description: "The provider's Social Security Number (SSN).\n    - Only include when specifically instructed by a payer - for example, if the provider doesn't have an [NPI](https://www.stedi.com/docs/healthcare/national-provider-identifier). This use case is very rarely supported, and is typically when the provider is a non-medical provider, such as a social worker, home health aide, or transportation service.\n    - If the payer has instructed you to send an EIN but the provider operates using their SSN, use provider.taxId instead of this field.\n    - Don't use this for Federally-administered programs, such as Medicare."
          pattern: ^\d{9}$
          type: string
          x-meta:
            title: Social Security Number (SSN)
        stateLicenceNumber:
          description: The provider's state license number. If you include this information, you must also include the `informationReceiverAdditionalIdentifierState`. Only include when required by a payer.
          maxLength: 50
          minLength: 1
          type: string
        submitterIdNumber:
          description: The provider's submitter identification number. Only include when required by a payer.
          maxLength: 50
          minLength: 1
          type: string
        taxId:
          description: The provider's Federal Taxpayer Identification Number. This is typically the provider's EIN (Employer Identification Number), but the provider's SSN may be used if the provider does not have an EIN. Only include if required by the payer.
          pattern: ^\d{9}$
          type: string
      type: object
    RequestSubscriber:
      description: 'The primary policyholder for the insurance plan _or_ a dependent with a unique member ID. If a dependent has a unique member ID, include their information here and leave `dependents` empty.

        - At a minimum, our API requires that you supply at least one of these fields in the request: `memberId`, `dateOfBirth`, or `lastName`. However, each payer has different requirements, so you should supply the fields necessary for each payer to identify the subscriber in their system.

        - When you provide all four of `memberId`, `dateOfBirth`, `firstName`, and `lastName`, payers are required to return a response if the member is in their database. Some payers may be able to search with less information, but this varies by payer.

        - We recommend always including the patient''s member ID when possible.

        - Enter the patient''s name exactly as written on their insurance card, if available, including any special or punctuation characters such as apostrophes, hyphens (dashes), or spaces. Visit [patient names](https://www.stedi.com/docs/healthcare/send-eligibility-checks#patient-names) for all best practices to avoid unnecessary failures.'
      properties:
        additionalIdentification:
          $ref: '#/components/schemas/AdditionalIdentificationSubscriber'
        address:
          $ref: '#/components/schemas/RequestSubscriberAddress'
        beginningCardIssueDate:
          description: The date the subscriber's insurance card was issued. Use when you need to specify a date range. Provide the end of the range in the `endCardIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        beginningPlanIssueDate:
          description: The date the subscriber's insurance plan begins. Use when you need to specify a date range. Provide the end of the range in the `endPlanIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        birthSequenceNumber:
          description: The number assigned to each family member born with the same birth date, such as twins or triplets. Use to indicate the birth order when there are multiple births associated with the provided birth date.
          maxLength: 9
          minLength: 1
          pattern: ^[0-9]$
          type: string
        caseNumber:
          description: The case number associated with the subscriber.
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9]+$
          type: string
        coverageLevelCode:
          description: This property is no longer used.
          type: string
        dateOfBirth:
          description: The subscriber's date of birth.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        endCardIssueDate:
          description: The date the subscriber's insurance card expires. Use when you need to specify a date range. Provide the start of the range in the `beginningCardIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        endPlanIssueDate:
          description: The date the subscriber's insurance plan ends. Use when you need to specify a date range. Provide the start of the range in the `beginningPlanIssueDate` property.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        firstName:
          description: The patient's first name.
          maxLength: 35
          minLength: 1
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
          description: Code indicating the subscriber's gender.
        groupNumber:
          description: The group number associated with the subscriber's insurance policy.
          maxLength: 50
          minLength: 1
          type: string
        healthCareCodeInformation:
          description: "Information about the subscriber's health care diagnosis. You can include up to eight entries in this array. \n\nThe first array entry must have `diagnosisTypeCode` set to `ABK`. All subsequent entries must have `diagnosisTypeCode` set to `ABF`."
          items:
            $ref: '#/components/schemas/HealthCareInformation'
          maxItems: 8
          minItems: 1
          type: array
        idCard:
          description: The subscriber's identification card number. Include this property when this number is different than the subscriber's member ID. This is common in Medicaid.
          maxLength: 50
          minLength: 1
          type: string
        idCardIssueDate:
          description: The date the subscriber's insurance card was issued. Use to specify a single date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        lastName:
          description: The subscriber's last name. **Don't** include the subscriber's name suffix, such as Jr. or III. Use the designated `suffix` property instead.
          maxLength: 60
          minLength: 1
          type: string
        medicaidRecipientIdentificationNumber:
          description: The Medicaid Recipient Identification Number. You can provide this number to identify the subscriber when it is the primary number the payer knows a member by (such as for Medicare or Medicaid). Do not supply this value unless it is different from the `memberId`.
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9]+$
          type: string
        memberId:
          description: The member ID for the subscriber's insurance policy.
          maxLength: 80
          minLength: 2
          pattern: ^[A-Za-z0-9- ]+$
          type: string
        middleName:
          description: The patient's middle name or middle initial.
          maxLength: 25
          minLength: 1
          type: string
        planIssueDate:
          description: The date the subscriber's insurance plan begins. Use to specify a single date.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$
          type: string
        providerCode:
          $ref: '#/components/schemas/RequestSubscriberProviderCode'
        providerIdentifier:
          description: "The provider identifier you specified in the `referenceIdentificationQualifier` property. It is **required** if you set the `referenceIdentificationQualifier`. For example, this property could contain the provider's National Provider ID or Federal Taxpayer Identification number.\n\n If you set the `referenceIdentificationQualifier` to `PXC`, then this property should contain the provider's taxonomy code."
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9]+$
          type: string
        referenceIdentificationQualifier:
          $ref: '#/components/schemas/RequestSubscriberReferenceIdentificationQualifier'
        spendDownAmount:
          description: Identify the dollar amount the subscriber will apply toward their spend down amount, if required. For some Medicaid programs, individuals must pay a certain amount towards their healthcare cost (spend down) before coverage starts.
          maxLength: 15
          minLength: 1
          type: string
        spendDownTotalBilledAmount:
          description: The subscriber's spend down total billed amount.
          maxLength: 15
          minLength: 1
          type: string
        ssn:
          description: The subscriber's Social Security Number (SSN). Many commercial and government payers ignore this property due to concerns about member privacy. However, some Medicaid programs support alternative searches using the patient's Social Security Number, instead of the member ID.
          pattern: ^\d{9}$
          type: string
          x-meta:
            title: Social Security Number (SSN)
        suffix:
          description: The name suffix, such as Jr., Sr., or III. Only include the subscriber's personal name suffix - **don't** include professional or academic titles, such as M.D. or MBA.
          maxLength: 10
          minLength: 1
          type: string
      type: object
    EligibilityCheckRequestDependentPersonName:
      description: The name of a dependent, who is always a person.
      properties:
        firstName:
          description: The dependent's first name.
          maxLength: 35
          minLength: 1
          type: string
        lastName:
          description: The dependent's last name. **Don't** include the dependent's name suffix, such as Jr. or III. Use the designated `suffix` property instead.
          maxLength: 60
          minLength: 1
          type: string
        middleName:
          description: The dependent's middle name or middle initial.
          maxLength: 25
          minLength: 1
          type: string
        suffix:
          description: The dependent's name suffix, such as Jr. or III. Only include the dependent's personal name suffix - **don't** include professional or academic titles, such as M.D. or MBA.
          maxLength: 10
          minLength: 1
          type: string
      required:
      - firstName
      - lastName
      type: object
    EntityTypeQualifier:
      description: 'The type of entity.


        Payers may sometimes return other non-compliant values.'
      enum:
      - Person
      - Non-Person Entity
      type: string
    EligibilityCheckPlan:
      description: An insurance plan and its benefits.
      properties:
        benefits:
          $ref: '#/components/schemas/EligibilityCheckBenefits'
          description: Benefit information from the payer, organized into categories like cost-sharing (co-insurance, deductibles, copayments), coverage details (exclusions, limitations), and eligibility statuses.
        name:
          description: The name of the plan. Stedi derives this from the plan names the payer sends in the benefit entries. This property is present when the payer sends consistent plan names, and absent when the data is missing, ambiguous, or contradictory. When absent, check each benefit's `planCoverageDescription` for the plan information.
          type: string
      required:
      - benefits
      type: object
    BenefitsInformationCoverageLevelName:
      description: 'The full name of the coverage level code.


        Payers may sometimes return other non-compliant values.'
      enum:
      - Children Only
      - Dependents Only
      - Employee and Children
      - Employee Only
      - Employee and Spouse
      - Family
      - Individual
      - Spouse and Children
      - Spouse Only
      type: string
    MaintenanceReasonCode:
      description: 'Code identifying the reason for the changes to subscriber identifying information, such as name, date of birth, or address. This is always `25`


        Payers may sometimes return other non-compliant values.'
      enum:
      - '25'
      type: string
    EligibilityCheckError:
      description: When a payer rejects your eligibility check, the response contains one or more AAA errors that specify the reasons for the rejection and any recommended follow-up actions. [Learn more](https://www.stedi.com/docs/healthcare/eligibility-troubleshooting#payer-aaa-errors)
      properties:
        code:
          $ref: '#/components/schemas/EligibilityCheckErrorCode'
          description: 'The error code. Visit [Eligibility troubleshooting](https://www.stedi.com/docs/healthcare/eligibility-troubleshooting#payer-aaa-errors) for a complete list of all possible error codes and descriptions.


            Payers may sometimes return other non-compliant values.'
        description:
          description: The error description.
          type: string
        field:
          description: The error type, `AAA`.
          type: string
        followupAction:
          $ref: '#/components/schemas/EligibilityCheckFollowupAction'
          description: 'Recommended follow-up action based on the rejection reason code.


            **Note**: `Resubmission Not Allowed` doesn''t mean you should never resubmit the request. Intermediary clearinghouses may send this code when they''ve temporarily lost connection to the payer, so this code indicates that you should wait at least a few minutes before retrying instead of retrying immediately.


            Payers may sometimes return other non-compliant values.'
        location:
          description: The location of the error within the original X12 EDI response.
          type: string
        possibleResolutions:
          description: 'Information to help you correct the error.


            We periodically update this guidance, so these strings may change at any time and may differ between eligibility responses. **Don''t build programmatic logic that depends on matching these strings exactly.**'
          type: string
      type: object
    BenefitsInformation:
      properties:
        additionalInformation:
          description: A free-form message containing additional information about the benefits in the response.
          items:
            $ref: '#/components/schemas/AdditionalInformation'
          type: array
        authOrCertIndicator:
          $ref: '#/components/schemas/AuthOrCertIndicator'
          description: "Code indicating whether the benefit is subject to prior authorization or certification. Can be `Y` - Yes, `N` - No, or `U` - Unknown.\n  - When this property is set to `U`, it means the payer can't determine in real time whether prior authorization is required for the service. They may require additional details, like diagnosis or place of service to make a determination. Check the `additionalInformation[].description` property for any additional clarification. You can also contact the payer directly or use their provider portal to get more information.\n  - Some payers may send additional notes about prior authorization rules in the `additionalInformation[].description` property. Payers may also send prior authorization notes in a separate `benefitsInformation` object with a code of `1` (Active coverage), `CB` (Coverage Benefit), or `D` (Benefit Description).\n\nVisit our [patient benefits docs](https://www.stedi.com/docs/healthcare/eligibility-network-status-authorization-referrals#is-prior-authorization-required) to learn more about prior authorization.\n\nPayers may sometimes return other non-compliant values."
        benefitAmount:
          description: "The monetary benefit amount, such as a patient's co-pay or deductible. This value is expressed as a decimal, such as 100.00. \n \n The payer will always send a value in this property when the `benefitsInformation[].code` = `B` - Co-Payment, `C` - Deductible, `G` - Out of Pocket (Stop Loss), `J` - Cost Containment, or `Y` - Spend Down. For those codes, this value represents the patient's portion of responsibility. \n \n The payer will **never** send this value when `benefitsInformation[].code` = `A` - Co-Insurance. This property can contain zero when the patient has no responsibility. \n \n Learn more about [patient costs](https://www.stedi.com/docs/healthcare/eligibility-patient-responsibility-benefits)."
          type: string
        benefitPercent:
          description: "The percentage of the benefit, such as co-insurance. This property can contain zero when the patient has no responsibility. \n \n The payer will always send a value in this property when `benefitsInformation[].code` = `A` - Co-Insurance. For this code, this value represents the patient's portion of the responsibility. The percentage is expressed as a decimal, such as `0.80` represents 80%. \n \n The payer will **never** send a value in this property when `benefitsInformation[].code` = `B` - Co-Payment, `C` - Deductible, `G` - Out of Pocket (Stop Loss), `J` - Cost Containment, or `Y` - Spend Down. \n \n Learn more about [patient costs](https://www.stedi.com/docs/healthcare/eligibility-patient-responsibility-benefits)."
          type: string
        benefitQuantity:
          description: The quantity of the benefit, qualified by the type specified in `quantityQualifier`. For example, `10` when the `quantityQualifier` is `Visits`.
          type: string
        benefitsAdditionalInformation:
          $ref: '#/components/schemas/BenefitsAdditionalInformation'
        benefitsDateInformation:
          $ref: '#/components/schemas/BenefitsDateInformation'
        benefitsRelatedEntities:
          description: 'Other entities associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer. When present, this array typically contains information about the patient''s primary care provider (PCP), another organization that handles a specific benefit type (such as telehealth mental health services), or another health plan for the patient (coordination of benefits scenarios).

            - This is where information for a crossover carrier such as Medicaid or Medicare is provided, if it''s applicable to the patient and the payer supports it.

            - For Blue Cross Blue Shield (BCBS) payers, Stedi returns an entry containing information about the patient''s home plan - the plan that actually verified the coverage. In this object, the `entityIdentifier` property is set to `Party Performing Verification`. [Learn more](https://www.stedi.com/docs/healthcare/eligibility-plan-details#bcbs-home-plan)'
          items:
            $ref: '#/components/schemas/BenefitsRelatedEntity'
          type: array
        benefitsRelatedEntity:
          $ref: '#/components/schemas/BenefitsRelatedEntity'
          deprecated: true
          description: Please use `benefitsInformation[].benefitsRelatedEntities` instead.
        benefitsServiceDelivery:
          items:
            $ref: '#/components/schemas/BenefitsServiceDelivery'
          type: array
        code:
          $ref: '#/components/schemas/BenefitsInformationCode'
        compositeMedicalProcedureIdentifier:
          $ref: '#/components/schemas/CompositeMedicalProcedureIdentifier'
        coverageLevel:
          $ref: '#/components/schemas/BenefitsInformationCoverageLevelName'
        coverageLevelCode:
          $ref: '#/components/schemas/BenefitsInformationCoverageLevelCode'
        eligibilityAdditionalInformation:
          $ref: '#/components/schemas/EligibilityAdditionalInformation'
          deprecated: true
          description: Please use `benefitsInformation[].eligibilityAdditionalInformationList` instead.
        eligibilityAdditionalInformationList:
          description: Used when there are multiple Nature of Injury Codes or a Facility Type Codes included in the response.
          items:
            $ref: '#/components/schemas/EligibilityAdditionalInformation'
          type: array
        headerLoopIdentifierCode:
          description: The loop header identifier number in the `LS` segment of the original X12 EDI transaction.
          type: string
        inPlanNetworkIndicator:
          $ref: '#/components/schemas/InPlanNetworkIndicatorName'
        inPlanNetworkIndicatorCode:
          $ref: '#/components/schemas/InPlanNetworkIndicatorCode'
        insuranceType:
          $ref: '#/components/schemas/InsuranceTypeName'
        insuranceTypeCode:
          $ref: '#/components/schemas/InsuranceTypeCode'
          description: 'Code identifying the type of insurance policy. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#insurance-type-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        name:
          $ref: '#/components/schemas/BenefitsInformationName'
        planCoverage:
          description: 'The specific product name or special program name for an insurance plan. For example `Gold 1-2-3`.


            Payers are normally required to send the plan name when `benefitsInformation[].code` is set to values `1` - `8` and the `benefitsInformation[].serviceTypeCodes` contains `30` (Health Benefit Plan Coverage). However, behavior may vary by payer, so don''t rely on this information being present in the response. Note that the plan name returned in this property may not exactly match the name the payer uses in official plan documents or marketing literature.


            Visit [What''s the plan name?](https://www.stedi.com/docs/healthcare/eligibility-plan-details#plan-name) in the benefits response documentation for more details.'
          type: string
        quantityQualifier:
          $ref: '#/components/schemas/QuantityQualifierName'
          description: 'The name of the `quantityQualifierCode`.


            Payers may sometimes return other non-compliant values.'
        quantityQualifierCode:
          $ref: '#/components/schemas/QuantityQualifierCode'
          description: 'Code indicating the type of quantity for the benefit. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#quantity-qualifier-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        serviceTypeCodes:
          description: 'Service Type Codes (STCs) related to the benefit type. For example, `7` - Anesthesia. Visit [Service Type Codes](https://www.stedi.com/docs/healthcare/eligibility-active-coverage-benefits#service-type-codes) for a complete list.


            This list is specific to X12 version 005010, which is the mandated version for eligibility checks. It differs from the current [X12 Service Type Codes](https://x12.org/codes/service-type-codes) list, which applies to X12 versions later than 005010.


            Payers may sometimes return other non-compliant values.'
          items:
            $ref: '#/components/schemas/ResponseEligibilityServiceTypeCode'
          type: array
        serviceTypes:
          description: 'The names of the Service Type Codes listed in the `serviceTypeCodes` array. Visit [Service Type Codes](https://www.stedi.com/docs/healthcare/eligibility-active-coverage-benefits#service-type-codes) for a complete list of codes and their names.


            The word physician in service type codes refers to any healthcare provider, including physician assistants, nurse practitioners, and other types of healthcare professionals.


            Payers may sometimes return other non-compliant values.'
          items:
            $ref: '#/components/schemas/ResponseEligibilityServiceType'
          type: array
        timeQualifier:
          $ref: '#/components/schemas/TimeQualifierName'
          description: 'The name of the `timeQualifierCode`.


            Payers may sometimes return other non-compliant values.'
        timeQualifierCode:
          $ref: '#/components/schemas/TimeQualifierCode'
          description: 'Code indicating the time period for the benefit information. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#time-qualifier-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        trailerLoopIdentifierCode:
          description: The loop trailer identifier number in the `LE` segment of the original X12 EDI transaction.
          type: string
      type: object
    EligibilityCheckSecondSurgicalOpinionRequired:
      description: Indicates the plan requires a second surgical opinion before this benefit is available. This is a precondition for obtaining the benefit.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount associated with this benefit.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage associated with this benefit.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
      required:
      - coverageLevel
      type: object
    InternalServerException:
      description: The service failed unexpectedly. Retry with backoff.
      properties:
        message:
          description: Why the request failed. The wording can change, so branch on the exception type, not this text.
          type: string
      required:
      - message
      type: object
    EligibilityCheckPriorAuthIndicator:
      description: 'Code indicating whether the benefit is subject to prior authorization or certification.


        Payers may sometimes return other non-compliant values.'
      enum:
      - REQUIRED
      - NOT_REQUIRED
      type: string
    QuantityQualifierCode:
      description: 'Code indicating the type of quantity for the benefit.


        Payers may sometimes return other non-compliant values.'
      enum:
      - 8H
      - '99'
      - CA
      - CE
      - D3
      - DB
      - DY
      - HS
      - LA
      - LE
      - M2
      - MN
      - P6
      - QA
      - S7
      - S8
      - VS
      - YY
      type: string
    EligibilityCheckRequestSubscriberAddress:
      description: 'The subscriber''s address. When providing address information:

        - `addressLine1` and `city` are **required** for standard eligibility checks and MBI lookups with SSN. We also recommend including `state` for member identification.


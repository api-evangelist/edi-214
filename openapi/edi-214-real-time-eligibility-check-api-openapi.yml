    EligibilityCheckRequestSubscriber:
      description: 'The primary policyholder for the insurance plan _or_ a dependent with a unique member ID. If a dependent has a unique member ID, include their information here and leave `dependent` empty.

        - At a minimum, our API requires that you supply at least one of these fields in the request: `memberId`, `dateOfBirth`, or `name.person.lastName`. However, each payer has different requirements, so you should supply the fields necessary for each payer to identify the subscriber in their system.

        - When you provide all four of `memberId`, `dateOfBirth`, `name.person.firstName`, and `name.person.lastName`, payers must return a response if the member is in their database. Some payers may be able to search with less information, but this varies by payer.

        - We recommend always including the patient''s member ID when possible.

        - Enter the patient''s name exactly as written on their insurance card, if available, including any special or punctuation characters such as apostrophes, hyphens (dashes), or spaces. Visit [patient names](https://www.stedi.com/docs/healthcare/send-eligibility-checks#patient-names) for all best practices to avoid unnecessary failures.'
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckRequestSubscriberAdditionalInformation'
          description: 'Additional identification numbers for the subscriber. Use this object when you need to provide an identification number other than or in addition to the subscriber''s member ID. For example, you may provide the patient account number.


            Don''t include the health insurance claim number or the medicaid recipient ID number here unless they are different from the member ID.'
        address:
          $ref: '#/components/schemas/EligibilityCheckRequestSubscriberAddress'
          description: The subscriber's address.
        birthSequenceNumber:
          description: The number assigned to each family member born with the same birth date, such as twins or triplets. Use to indicate the birth order when there are multiple births associated with the provided birth date.
          maximum: 999999999
          minimum: 1
          type: integer
        dateOfBirth:
          description: The subscriber's date of birth.
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          type: string
        gender:
          $ref: '#/components/schemas/EligibilityCheckRequestPatientGender'
          description: Code indicating the subscriber's gender.
        memberId:
          description: The member ID for the subscriber's insurance policy.
          maxLength: 80
          minLength: 2
          type: string
        name:
          $ref: '#/components/schemas/EligibilityCheckRequestSubscriberName'
          description: The subscriber's name, as either a person or an organization.
        provider:
          $ref: '#/components/schemas/EligibilityCheckRequestEntityProvider'
          description: Information about a provider associated with the subscriber who isn't the entity requesting the eligibility check, such as a referring provider. The requesting provider is specified in the request's root `provider`.
      type: object
    EligibilityCheckServiceDeliveryLimitDelivery:

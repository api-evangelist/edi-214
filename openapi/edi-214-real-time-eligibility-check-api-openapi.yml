      type: string
    EligibilityCheckCoverageBasis:
      description: Describes the financial basis of the patient's health plan or eligibility for enrollment. For example, payers may use this type to indicate that a plan is fully insured, meaning the payer assumes full financial responsibility for medical claims. Payers may also use this type to indicate carve-out benefits, such as when the patient is enrolled in state-managed health programs, or to explain why a member was allowed to enroll in the plan (such as age range or having a disability). The detail is usually included as free text in `messages` or identifiers in `additionalInformation`.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount associated with this benefit.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage associated with this benefit.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
      required:
      - coverageLevel
      type: object
    EligibilityCheckBenefits:
      description: Benefit information from the payer, organized into categories like cost-sharing (co-insurance, deductibles, copayments), coverage details (exclusions, limitations), and eligibility statuses.
      properties:
        benefitDescription:
          description: 'A list of free-text benefit descriptions from the payer.


            Payers sometimes use this type to communicate information that''s difficult to capture elsewhere in the response. The description is included as free text in `messages` or identifiers in `additionalInformation`.'
          items:
            $ref: '#/components/schemas/EligibilityCheckBenefitDescription'
          type: array
        benefitDisclaimer:
          description: 'A list of disclaimers from the payer.


            A legal or advisory disclaimer attached to the benefit information. The X12 standard discourages use of this type, but many commercial payers still send disclaimers. When present, the disclaimer text arrives in `messages`, and there should be only one disclaimer per individual response.'
          items:
            $ref: '#/components/schemas/EligibilityCheckBenefitDisclaimer'
          type: array
        cannotProcess:
          description: 'A list of entries indicating the payer couldn''t process your request.


            Indicates that the payer couldn''t process your request. A common cause is requesting benefits information for a service type or procedure code the payer doesn''t support.'
          items:
            $ref: '#/components/schemas/EligibilityCheckCannotProcess'
          type: array
        cardReportedStolen:
          description: 'A list of entries indicating the patient''s card has been reported lost or stolen.


            This typically means that the payer has flagged the patient''s member ID to prevent identity theft. The patient may still have active coverage, but you likely won''t be able to run transactions with the patient''s information until they resolve the issue.'
          items:
            $ref: '#/components/schemas/EligibilityCheckCardReportedStolen'
          type: array
        coInsurance:
          description: 'A list of co-insurance benefit entries from the payer.


            The `percent` is the patient''s share of costs, expressed as a decimal (such as `0.8` for 80%). The decimal precision reflects what the payer sent. A value of `0` indicates the payer reported no co-insurance responsibility.'
          items:
            $ref: '#/components/schemas/EligibilityCheckCoInsurance'
          type: array
        coPayment:
          description: 'A list of copayment benefit entries from the payer.


            The `amount` is the fixed amount the patient pays for a service. The decimal precision reflects what the payer sent (for example, `25.0` or `40`).'
          items:
            $ref: '#/components/schemas/EligibilityCheckCoPayment'
          type: array
        contactFollowingEntityForInformation:
          description: 'A list of entries directing you to contact another entity for benefit information.


            Indicates that the payer can''t supply the information you requested and is directing you to another entity. The entity''s information is listed in the `relatedEntities` array.'
          items:
            $ref: '#/components/schemas/EligibilityCheckContactFollowingEntityForInformation'
          type: array
        costContainment:
          description: 'A list of cost containment benefit entries from the payer.


            Cost containment refers to rules a health plan may have in place to control the cost of care. This benefit is typically included when the patient has Medicaid coverage. The `amount` represents the total the patient pays out-of-pocket before benefits begin. The decimal precision reflects what the payer sent (for example, `500.0` or `500`).'
          items:
            $ref: '#/components/schemas/EligibilityCheckCostContainment'
          type: array
        coverageBasis:
          description: 'A list of coverage basis entries from the payer.


            Describes the financial basis of the patient''s health plan or eligibility for enrollment. For example, payers may use this type to indicate that a plan is fully insured, meaning the payer assumes full financial responsibility for medical claims. Payers may also use this type to indicate carve-out benefits, such as when the patient is enrolled in state-managed health programs, or to explain why a member was allowed to enroll in the plan (such as age range or having a disability). The detail is usually included as free text in `messages` or identifiers in `additionalInformation`.'
          items:
            $ref: '#/components/schemas/EligibilityCheckCoverageBasis'
          type: array
        deductible:
          description: 'A list of deductible benefit entries from the payer.


            The `amount` is what the patient must pay before the plan begins covering costs. The decimal precision reflects what the payer sent (for example, `1500.0` or `1000`). Check `timePeriod` to determine what the amount represents. A calendar-year deductible is the patient''s total for the year, while a remaining deductible is the amount still owed before the plan pays.'
          items:
            $ref: '#/components/schemas/EligibilityCheckDeductible'
          type: array
        exclusions:
          description: 'A list of services or conditions the plan excludes from coverage.


            An exclusion is a service or condition the plan doesn''t cover for any patient. This is different from a `nonCovered` entry, which reports that this patient doesn''t have coverage for a specific service you submitted in the request.'
          items:
            $ref: '#/components/schemas/EligibilityCheckExclusion'
          type: array
        healthCareFacility:
          description: 'A list of health care facility information relevant to the patient''s benefits.


            These typically indicate an institution or provider network the patient is required or expected to use. The facility''s information is available in the `relatedEntities` array. Rarely returned.'
          items:
            $ref: '#/components/schemas/EligibilityCheckHealthCareFacility'
          type: array
        invalidEntries:
          $ref: '#/components/schemas/EligibilityCheckInvalidEntries'
          description: Benefit entries that Stedi couldn't include in the standard arrays due to data validation issues, such as missing required amounts or incorrect unit types.
        limitations:
          description: 'A list of benefit limitation entries, expressed as an amount, percent, or quantity.


            Dental and vision plans often use this benefit type to specify an annual maximum benefit amount.


            The Affordable Care Act prevents most commercial health plans from imposing limits on annual or lifetime benefit amounts, but this generally doesn''t apply to government health plans and some commercial health plans may be exempt.


            When present, the `amount` indicates the maximum benefit amount the plan allocates to the patient. The `messages` array often includes values like "ANNUAL MAXIMUM".'
          items:
            $ref: '#/components/schemas/EligibilityCheckLimitation'
          type: array
        managedCareCoordinator:
          description: 'A list of managed care coordinator information for the patient.


            When present, the care coordinator''s details are in the `relatedEntities` array.'
          items:
            $ref: '#/components/schemas/EligibilityCheckManagedCareCoordinator'
          type: array
        nonCovered:
          description: 'A list of non-covered services for the patient.


            Indicates that the patient''s plan doesn''t cover a specific service type you submitted in the eligibility check. Note that the absence of a `nonCovered` entry doesn''t mean that a specific service is covered.'
          items:
            $ref: '#/components/schemas/EligibilityCheckNonCovered'
          type: array
        notDeemedMedicalNecessity:
          description: 'A list of services the payer determined aren''t medically necessary for the patient.


            Indicates the payer has determined this service isn''t medically necessary and won''t cover it on that basis.'
          items:
            $ref: '#/components/schemas/EligibilityCheckNotDeemedMedicalNecessity'
          type: array
        otherOrAdditionalPayer:
          description: 'A list of other payers with coverage responsibility for the patient.


            Indicates another payer that has coverage responsibility for the patient. This is the signal for coordination of benefits (COB) scenarios. The other payer''s details are available in the `relatedEntities` array.'
          items:
            $ref: '#/components/schemas/EligibilityCheckOtherOrAdditionalPayer'
          type: array
        otherSourceOfData:
          description: 'A list of entries indicating the benefit information originates from another source.


            Indicates the information provided came from a source other than the payer''s own system. Rarely returned.'
          items:
            $ref: '#/components/schemas/EligibilityCheckOtherSourceOfData'
          type: array
        outOfPocket:
          description: 'A list of out-of-pocket maximum benefit entries from the payer.


            The `amount` is the limit on what the patient pays. The decimal precision reflects what the payer sent (for example, `5000.0` or `5000`). Check `timePeriod` to determine whether an amount is the full maximum or the amount remaining.'
          items:
            $ref: '#/components/schemas/EligibilityCheckOutOfPocket'
          type: array
        preExistingCondition:
          description: 'A list of coverage restrictions due to pre-existing conditions.


            Indicates coverage for this benefit is restricted because of a pre-existing condition.'
          items:
            $ref: '#/components/schemas/EligibilityCheckPreExistingCondition'
          type: array
        primaryCareProvider:
          description: 'A list of primary care providers for the patient.


            A PCP is the main healthcare provider responsible for managing a patient''s care and coordinating referrals to specialists. When present, the provider''s information is available in the `relatedEntities` array.'
          items:
            $ref: '#/components/schemas/EligibilityCheckPrimaryCareProvider'
          type: array
        priorYearsHistory:
          description: A list of historical benefits information for the patient.
          items:
            $ref: '#/components/schemas/EligibilityCheckPriorYearsHistory'
          type: array
        reserve:
          description: 'A list of reserve benefits for the patient.


            This type is primarily used by Medicare (HETS) to indicate lifetime reserve benefit amounts separate from annual limits. For example, Medicare Lifetime Reserve days – the limited pool of additional inpatient hospital days a patient can use after exhausting a benefit period.'
          items:
            $ref: '#/components/schemas/EligibilityCheckReserve'
          type: array
        secondSurgicalOpinionRequired:
          description: 'A list of benefits requiring a second surgical opinion for coverage.


            Indicates the plan requires a second surgical opinion before this benefit is available. This is a precondition for obtaining the benefit.'
          items:
            $ref: '#/components/schemas/EligibilityCheckSecondSurgicalOpinionRequired'
          type: array
        servicesRestrictedToFollowingProvider:
          description: 'A list of services restricted to specific providers.


            Indicates the benefit is available only when delivered by a particular provider, identified in `relatedEntities`. This doesn''t confirm whether that provider is in or out of network with the payer.'
          items:
            $ref: '#/components/schemas/EligibilityCheckServicesRestrictedToFollowingProvider'
          type: array
        spendDown:
          description: 'A list of spend down benefit entries from the payer.


            Spend down is a process that allows individuals with high medical expenses to qualify for Medicaid even if their income is above the Medicaid income limit. The `amount` represents the total the patient pays out-of-pocket before they can receive Medicaid benefits. The decimal precision reflects what the payer sent (for example, `1500.0` or `1500`).'
          items:
            $ref: '#/components/schemas/EligibilityCheckSpendDown'
          type: array
        statuses:
          description: Eligibility status benefit entries from the payer. Each entry indicates whether the patient has active or inactive coverage for a specific service, network, and coverage level.
          items:
            $ref: '#/components/schemas/EligibilityCheckEligibilityStatus'
          type: array
        unlimited:
          description: 'A list of unlimited benefits for the patient''s plan.


            For example, unlimited physical therapy visits or unlimited preventive care.'
          items:
            $ref: '#/components/schemas/EligibilityCheckUnlimited'
          type: array
      type: object
    EligibilityCheckCardReportedStolen:
      description: A fraud alert indicating the patient's insurance card was reported lost or stolen. This typically means that the payer has flagged the patient's member ID to prevent identity theft. The patient may still have active coverage, but you likely won't be able to run transactions with the patient's information until they resolve the issue.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'

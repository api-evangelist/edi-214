    ProviderInformation:
      properties:
        providerCode:
          $ref: '#/components/schemas/ResponseProviderCode'
          description: 'A code that communicates the provider''s role in the type of benefits information in the response. Visit [Eligibility code lists](https://www.stedi.com/docs/healthcare/eligibility-code-lists#provider-codes) for a complete list.


            Payers may sometimes return other non-compliant values.'
        referenceIdentification:
          description: The provider's taxonomy code.
          type: string
      type: object
    EligibilityCheckPayerError:
      description: When a payer rejects your eligibility check, the response contains one or more `AAA` errors that specify the reasons for the rejection and any recommended follow-up actions. Common reasons for rejection at the `payer` level include issues with payer enrollment and that the payer's system is down or experiencing issues. [Learn more](https://www.stedi.com/docs/healthcare/eligibility-troubleshooting#payer-aaa-errors)
      properties:
        code:
          $ref: '#/components/schemas/EligibilityCheckPayerErrorCode'
          description: 'The error code.


            Payers may sometimes return other non-compliant values.'
        description:
          description: The error description.
          type: string
        field:
          description: The error type, `AAA`.
          type: string
        followupAction:
          $ref: '#/components/schemas/EligibilityCheckFollowupAction'
          description: 'Recommended follow-up action based on the rejection reason code.


            **Note**: `Resubmission Not Allowed` doesn''t mean you should never resubmit the request. Intermediary clearinghouses may send this code when they''ve temporarily lost connection to the payer, so this code indicates that you should wait at least a few minutes before retrying instead of retrying immediately.


            Payers may sometimes return other non-compliant values.'
        location:
          description: The location of the error within the original X12 EDI response.
          type: string
        possibleResolutions:
          description: 'Information to help you correct the error.


            We periodically update this guidance, so these strings may change at any time and may differ between eligibility responses. **Don''t build programmatic logic that depends on matching these strings exactly.**'
          type: string
      type: object
    ApplicationModes:
      description: 'The type of data in the request. This is either `production` when you send a request with a standard API key or `test` when you send a request in test mode with a [test API key](https://www.stedi.com/docs/api-reference/index#api-key-types). The `information` value is not currently used.


        Payers may sometimes return other non-compliant values.'
      enum:
      - production
      - test
      - information
      type: string
    EligibilityCheckMaintenanceIndicator:
      description: Indicates whether the payer signaled that the patient's identifying information differs from what you submitted.
      enum:
      - NONE
      - PAYER_INDICATED
      type: string
    EligibilityCheckBenefitDisclaimer:
      description: A legal or advisory disclaimer attached to the benefit information. The X12 standard discourages use of this type, but many commercial payers still send disclaimers. When present, the disclaimer text arrives in `messages`, and there should be only one disclaimer per individual response.
      properties:
        additionalInformation:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitAdditionalInformation'
          description: Additional plan, group, and policy identification numbers for this benefit entry.
        amount:
          description: The monetary amount associated with this benefit.
          type: string
        coverageLevel:
          $ref: '#/components/schemas/EligibilityCheckCoverageLevel'
          description: 'The level of coverage this benefit applies to, such as `INDIVIDUAL` or `FAMILY`. Defaults to `INDIVIDUAL` when the payer doesn''t send a coverage level.


            Payers may sometimes return other non-compliant values.'
        dates:
          $ref: '#/components/schemas/EligibilityCheckEligibilityAndBenefitDateRanges'
          description: Dates associated with this benefit, as ISO 8601 date ranges.
        diagnosis:
          $ref: '#/components/schemas/EligibilityCheckDiagnosis'
          description: The diagnosis this benefit covers. Present when the benefit is limited to specific diagnoses from the patient's diagnosis list.
        insuranceType:
          $ref: '#/components/schemas/EligibilityCheckInsuranceType'
          description: 'Code identifying the type of insurance policy.


            Payers may sometimes return other non-compliant values.'
        messages:
          description: Free-form messages from the payer providing additional information about this benefit entry, like prior authorization requirements, network restrictions, benefit limits, or plan details. Message content isn't standardized and varies by payer.
          items:
            type: string
          type: array
        network:
          $ref: '#/components/schemas/EligibilityCheckNetwork'
          description: Network information for a benefit, including the in-plan network indicator and plan network identification.
        percent:
          description: The percentage associated with this benefit.
          type: string
        placesOfService:
          description: The locations where providers may deliver healthcare services for this benefit. Common examples include physician offices, hospitals, and patient homes. When present, this indicates facility-specific coverage details.
          items:
            $ref: '#/components/schemas/EligibilityCheckPlaceOfService'
          type: array
        planCoverageDescription:
          description: The plan coverage description from EB05. Populated when the EB05 value doesn't relate to a plan (e.g., payer used EB05 for benefit-level info rather than a plan name).
          type: string
        priorAuthIndicator:
          $ref: '#/components/schemas/EligibilityCheckPriorAuthIndicator'
          description: 'Code indicating whether the benefit is subject to prior authorization or certification.


            Payers may sometimes return other non-compliant values.'
        relatedEntities:
          description: Another entity associated with the eligibility or benefits. This could be a provider, an individual, an organization, or another payer.
          items:
            $ref: '#/components/schemas/EligibilityCheckRelatedEntity'
          type: array
        service:
          $ref: '#/components/schemas/EligibilityCheckServiceOrProcedure'
          description: The service or procedure that this benefit applies to, using a code or code range within a code system like CPT, HCPCS, or NDC.
        serviceLimits:
          description: Service delivery limits for this benefit, like visit frequency restrictions, age boundaries, or delivery schedules.
          items:
            $ref: '#/components/schemas/EligibilityCheckServiceLimit'
          type: array
      required:
      - coverageLevel
      type: object

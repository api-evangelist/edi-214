          type: string
        plan:
          description: Only included when multiple plans apply to the patient or multiple plan periods apply.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(-\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01]))?$
          type: string
        planBegin:
          description: Only included when multiple plans apply to the patient or multiple plan periods apply.
          pattern: ^\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(-\d{4}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01]))?$
          type: string
        planEnd:

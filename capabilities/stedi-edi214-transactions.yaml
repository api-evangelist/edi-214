naftiko: 1.0.0-alpha2
info:
  label: EDI 214 Transportation Carrier Shipment Status API — Transactions
  description: 'EDI 214 Transportation Carrier Shipment Status API — Transactions. 2 operations. Lead operation: List EDI
    214 transactions. Self-contained Naftiko capability covering one Edi 214 business surface.'
  tags:
  - Edi 214
  - Transactions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    EDI_214_API_KEY: EDI_214_API_KEY
capability:
  consumes:
  - type: http
    namespace: stedi-edi214-transactions
    baseUri: https://api.stedi.com/2024-01-01
    description: EDI 214 Transportation Carrier Shipment Status API — Transactions business capability. Self-contained, no
      shared references.
    resources:
    - name: transactions
      path: /transactions
      operations:
      - name: listtransactions
        method: GET
        description: List EDI 214 transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: direction
          in: query
          type: string
          description: Filter by transaction direction
        - name: processedAfter
          in: query
          type: string
          description: Filter transactions processed after this timestamp
        - name: status
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    - name: transactions-transactionId
      path: /transactions/{transactionId}
      operations:
      - name: gettransaction
        method: GET
        description: Get EDI 214 transaction details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: transactionId
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.EDI_214_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: stedi-edi214-transactions-rest
    port: 8080
    description: REST adapter for EDI 214 Transportation Carrier Shipment Status API — Transactions. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/transactions
      name: transactions
      description: REST surface for transactions.
      operations:
      - method: GET
        name: listtransactions
        description: List EDI 214 transactions
        call: stedi-edi214-transactions.listtransactions
        with:
          direction: rest.direction
          processedAfter: rest.processedAfter
          status: rest.status
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transactions/{transactionid}
      name: transactions-transactionid
      description: REST surface for transactions-transactionId.
      operations:
      - method: GET
        name: gettransaction
        description: Get EDI 214 transaction details
        call: stedi-edi214-transactions.gettransaction
        with:
          transactionId: rest.transactionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: stedi-edi214-transactions-mcp
    port: 9090
    transport: http
    description: MCP adapter for EDI 214 Transportation Carrier Shipment Status API — Transactions. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: list-edi-214-transactions
      description: List EDI 214 transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: stedi-edi214-transactions.listtransactions
      with:
        direction: tools.direction
        processedAfter: tools.processedAfter
        status: tools.status
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-edi-214-transaction-details
      description: Get EDI 214 transaction details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: stedi-edi214-transactions.gettransaction
      with:
        transactionId: tools.transactionId
      outputParameters:
      - type: object
        mapping: $.
